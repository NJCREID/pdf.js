<html dir="ltr" mozdisallowselectionprint>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <!--#if GENERIC || CHROME-->
    <meta name="google" content="notranslate" />
    <!--#endif-->
    <title>PDF.js viewer</title>

    <!--#if MOZCENTRAL-->
    <!--#include viewer-snippet-firefox-extension.html-->
    <!--#elif CHROME-->
    <!--#include viewer-snippet-chrome-extension.html-->
    <!--#else-->
    <!--#include viewer-snippet.html-->
    <!--#endif-->

    <!--#if MOZCENTRAL-->
    <!--<link rel="stylesheet" href="resource://pdf.js/web/viewer.css">-->
    <!--<link rel="localization" href="toolkit/pdfviewer/viewer.ftl"/>-->
    <!--#else-->
    <link rel="stylesheet" href="viewer.css" />
    <!--#endif-->

    <!--#if MOZCENTRAL-->
    <!--<script src="resource://pdf.js/web/viewer.mjs" type="module"></script>-->
    <!--#elif !MOZCENTRAL-->
    <!--<script src="viewer.mjs" type="module"></script>-->
    <!--#elif /* Development mode. */-->
    <link rel="resource" type="application/l10n" href="locale/locale.json" />

    <script type="importmap">
      {
        "imports": {
          "pdfjs/": "../src/",
          "pdfjs-lib": "../src/pdf.js",
          "pdfjs-web/": "./",

          "fluent-bundle": "../node_modules/@fluent/bundle/esm/index.js",
          "fluent-dom": "../node_modules/@fluent/dom/esm/index.js",
          "cached-iterable": "../node_modules/cached-iterable/src/index.mjs",

          "display-cmap_reader_factory": "../src/display/cmap_reader_factory.js",
          "display-standard_fontdata_factory": "../src/display/standard_fontdata_factory.js",
          "display-wasm_factory": "../src/display/wasm_factory.js",
          "display-fetch_stream": "../src/display/fetch_stream.js",
          "display-network": "../src/display/network.js",
          "display-node_stream": "../src/display/stubs.js",
          "display-node_utils": "../src/display/stubs.js",

          "web-annotation_editor_params": "./annotation_editor_params.js",
          "web-download_manager": "./download_manager.js",
          "web-external_services": "./genericcom.js",
          "web-null_l10n": "./genericl10n.js",
          "web-pdf_text_snippet_viewer": "./pdf_text_snippet_viewer.js",
          "web-pdf_cursor_tools": "./pdf_cursor_tools.js",
          "web-pdf_document_properties": "./pdf_document_properties.js",
          "web-pdf_sidebar_search": "./pdf_sidebar_search.js",
          "web-pdf_sidebar": "./pdf_sidebar.js",
          "web-preferences": "./genericcom.js",
          "web-print_service": "./pdf_print_service.js",
          "web-secondary_toolbar": "./secondary_toolbar.js",
          "web-toolbar": "./toolbar.js"
        }
      }
    </script>
    <script src="viewer.js" type="module"></script>
    <!--#endif-->
  </head>

  <body class="viewerBody" tabindex="0">
    <div id="outerContainer">
      <div id="sidebarContainer">
        <div class="sidebarSearchContainer">
          <div class="sidebarSearchWrapper">
            <input
              id="searchInput"
              class="sidebarSearchInput"
              tabindex="0"
              data-l10n-id="pdfjs-search-input"
              aria-invalid="false"
              autocomplete="off"
            />
            <button
              id="sidebarSearchButton"
              class="toolbarButton"
              type="button"
              tabindex="0"
              data-l10n-id="pdfjs-search-button"
            >
              <span data-l10n-id="pdfjs-search-button-label"></span>
            </button>
          </div>
        </div>
        <div id="sidebarContent">
          <div id="textSnippetView"></div>
        </div>
        <div id="sidebarResizer"></div>
      </div>
      <!-- sidebarContainer -->

      <div id="mainContainer">
        <div class="toolbar">
          <div id="toolbarContainer">
            <div id="toolbarViewer" class="toolbarHorizontalGroup">
              <div id="toolbarViewerLeft" class="toolbarHorizontalGroup">
                <button
                  id="sidebarToggleButton"
                  class="toolbarButton"
                  type="button"
                  tabindex="0"
                  data-l10n-id="pdfjs-toggle-sidebar-button"
                  aria-expanded="false"
                  aria-haspopup="true"
                  aria-controls="sidebarContainer"
                >
                  <span data-l10n-id="pdfjs-toggle-sidebar-button-label"></span>
                </button>
                <div class="toolbarButtonSpacer"></div>

                <div class="toolbarHorizontalGroup hiddenSmallView">
                  <button
                    class="toolbarButton"
                    type="button"
                    id="previous"
                    tabindex="0"
                    data-l10n-id="pdfjs-previous-button"
                  >
                    <span data-l10n-id="pdfjs-previous-button-label"></span>
                  </button>
                  <div class="splitToolbarButtonSeparator"></div>
                  <button
                    class="toolbarButton"
                    type="button"
                    id="next"
                    tabindex="0"
                    data-l10n-id="pdfjs-next-button"
                  >
                    <span data-l10n-id="pdfjs-next-button-label"></span>
                  </button>
                </div>
                <div class="toolbarHorizontalGroup">
                  <span class="loadingInput start toolbarHorizontalGroup">
                    <input
                      type="number"
                      id="pageNumber"
                      class="toolbarField"
                      value="1"
                      min="1"
                      tabindex="0"
                      data-l10n-id="pdfjs-page-input"
                      autocomplete="off"
                    />
                  </span>
                  <span id="numPages" class="toolbarLabel"></span>
                </div>
              </div>
              <div id="toolbarViewerMiddle" class="toolbarHorizontalGroup">
                <div class="toolbarHorizontalGroup">
                  <button
                    id="zoomOutButton"
                    class="toolbarButton"
                    type="button"
                    tabindex="0"
                    data-l10n-id="pdfjs-zoom-out-button"
                  >
                    <span data-l10n-id="pdfjs-zoom-out-button-label"></span>
                  </button>
                  <div class="splitToolbarButtonSeparator"></div>
                  <button
                    id="zoomInButton"
                    class="toolbarButton"
                    type="button"
                    tabindex="0"
                    data-l10n-id="pdfjs-zoom-in-button"
                  >
                    <span data-l10n-id="pdfjs-zoom-in-button-label"></span>
                  </button>
                </div>
                <div class="toolbarHorizontalGroup">
                  <div class="scaleContainer">
                    <div id="scaleInputContainer">
                      <input
                        id="scaleInput"
                        class="toolbarField"
                        type="number"
                        min="10"
                        max="400"
                        step="10"
                        value="100"
                        tabindex="0"
                        data-l10n-id="pdfjs-zoom-select"
                      />
                      <span class="toolbarLabel">%</span>
                    </div>
                    <button
                      id="actualWidthOption"
                      class="toolbarButton scale"
                      type="button"
                      tabindex="0"
                      data-l10n-id="pdfjs-scale-actual-button"
                    >
                      <span
                        data-l10n-id="pdfjs-scale-actual-button-label"
                      ></span>
                    </button>
                    <button
                      id="pageWidthOption"
                      class="toolbarButton scale"
                      type="button"
                      tabindex="0"
                      data-l10n-id="pdfjs-page-scale-width-button"
                    >
                      <span
                        data-l10n-id="pdfjs-page-scale-width-button-label"
                      ></span>
                    </button>
                  </div>
                </div>
              </div>
              <div id="toolbarViewerRight" class="toolbarHorizontalGroup">
                <div
                  id="cursorToolButtons"
                  class="toolbarButtonWithContainer"
                  role="radiogroup"
                >
                  <button
                    id="cursorSelectTool"
                    class="toolbarButton toggled hidden"
                    type="button"
                    tabindex="0"
                    data-l10n-id="pdfjs-cursor-text-select-tool-button"
                    role="radio"
                    aria-checked="true"
                  >
                    <span
                      data-l10n-id="pdfjs-cursor-text-select-tool-button-label"
                    ></span>
                  </button>
                  <button
                    id="cursorHandTool"
                    class="toolbarButton"
                    type="button"
                    tabindex="0"
                    data-l10n-id="pdfjs-cursor-hand-tool-button"
                    role="radio"
                    aria-checked="false"
                  >
                    <span
                      data-l10n-id="pdfjs-cursor-hand-tool-button-label"
                    ></span>
                  </button>
                </div>
                <div
                  id="editorModeButtons"
                  class="toolbarHorizontalGroup"
                  role="radiogroup"
                >
                  <div id="editorHighlight" class="toolbarButtonWithContainer">
                    <button
                      id="editorHighlightButton"
                      class="toolbarButton"
                      type="button"
                      disabled="disabled"
                      role="radio"
                      aria-expanded="false"
                      aria-haspopup="true"
                      aria-controls="editorHighlightParamsToolbar"
                      tabindex="0"
                      data-l10n-id="pdfjs-editor-highlight-button"
                    >
                      <span
                        data-l10n-id="pdfjs-editor-highlight-button-label"
                      ></span>
                    </button>
                    <div
                      class="editorParamsToolbar hidden doorHangerRight"
                      id="editorHighlightParamsToolbar"
                    >
                      <div
                        id="highlightParamsToolbarContainer"
                        class="editorParamsToolbarContainer"
                      >
                        <div
                          id="editorHighlightColorPicker"
                          class="colorPicker"
                        >
                          <span
                            id="highlightColorPickerLabel"
                            class="editorParamsLabel"
                            data-l10n-id="pdfjs-editor-highlight-colorpicker-label"
                          ></span>
                        </div>
                        <div id="editorHighlightThickness">
                          <label
                            for="editorFreeHighlightThickness"
                            class="editorParamsLabel"
                            data-l10n-id="pdfjs-editor-free-highlight-thickness-input"
                          ></label>
                          <div class="thicknessPicker">
                            <input
                              type="range"
                              id="editorFreeHighlightThickness"
                              class="editorParamsSlider"
                              data-l10n-id="pdfjs-editor-free-highlight-thickness-title"
                              value="12"
                              min="8"
                              max="24"
                              step="1"
                              tabindex="0"
                            />
                          </div>
                        </div>
                        <div id="editorHighlightVisibility">
                          <div class="divider"></div>
                          <div class="toggler">
                            <label
                              for="editorHighlightShowAll"
                              class="editorParamsLabel"
                              data-l10n-id="pdfjs-editor-highlight-show-all-button-label"
                            ></label>
                            <button
                              id="editorHighlightShowAll"
                              class="toggle-button"
                              type="button"
                              data-l10n-id="pdfjs-editor-highlight-show-all-button"
                              aria-pressed="true"
                              tabindex="0"
                            ></button>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
                <div
                  id="cursorToolSeparator"
                  class="verticalToolbarSeparator"
                ></div>

                <div class="toolbarHorizontalGroup hiddenMediumView">
                  <button
                    id="printButton"
                    class="toolbarButton"
                    type="button"
                    tabindex="0"
                    data-l10n-id="pdfjs-print-button"
                  >
                    <span data-l10n-id="pdfjs-print-button-label"></span>
                  </button>

                  <button
                    id="downloadButton"
                    class="toolbarButton"
                    type="button"
                    tabindex="0"
                    data-l10n-id="pdfjs-save-button"
                  >
                    <span data-l10n-id="pdfjs-save-button-label"></span>
                  </button>
                </div>

                <div class="verticalToolbarSeparator hiddenMediumView"></div>

                <div
                  id="secondaryToolbarToggle"
                  class="toolbarButtonWithContainer"
                >
                  <button
                    id="secondaryToolbarToggleButton"
                    class="toolbarButton"
                    type="button"
                    tabindex="0"
                    data-l10n-id="pdfjs-tools-button"
                    aria-expanded="false"
                    aria-haspopup="true"
                    aria-controls="secondaryToolbar"
                  >
                    <span data-l10n-id="pdfjs-tools-button-label"></span>
                  </button>
                  <div
                    id="secondaryToolbar"
                    class="hidden doorHangerRight menu"
                  >
                    <div
                      id="secondaryToolbarButtonContainer"
                      class="menuContainer"
                    >
                      <div class="visibleMediumView">
                        <button
                          id="secondaryPrint"
                          class="toolbarButton labeled"
                          type="button"
                          tabindex="0"
                          data-l10n-id="pdfjs-print-button"
                        >
                          <span data-l10n-id="pdfjs-print-button-label"></span>
                        </button>

                        <button
                          id="secondaryDownload"
                          class="toolbarButton labeled"
                          type="button"
                          tabindex="0"
                          data-l10n-id="pdfjs-save-button"
                        >
                          <span data-l10n-id="pdfjs-save-button-label"></span>
                        </button>

                        <!--#if !GENERIC-->
                        <!--            <div class="horizontalToolbarSeparator"></div>-->
                        <!--#endif-->
                      </div>

                      <div id="scrollModeButtons" role="radiogroup">
                        <button
                          id="scrollPage"
                          class="toolbarButton labeled"
                          type="button"
                          tabindex="0"
                          data-l10n-id="pdfjs-scroll-page-button"
                          role="radio"
                          aria-checked="false"
                        >
                          <span
                            data-l10n-id="pdfjs-scroll-page-button-label"
                          ></span>
                        </button>
                        <button
                          id="scrollVertical"
                          class="toolbarButton labeled toggled"
                          type="button"
                          tabindex="0"
                          data-l10n-id="pdfjs-scroll-vertical-button"
                          role="radio"
                          aria-checked="true"
                        >
                          <span
                            data-l10n-id="pdfjs-scroll-vertical-button-label"
                          ></span>
                        </button>
                        <button
                          id="scrollHorizontal"
                          class="toolbarButton labeled"
                          type="button"
                          tabindex="0"
                          data-l10n-id="pdfjs-scroll-horizontal-button"
                          role="radio"
                          aria-checked="false"
                        >
                          <span
                            data-l10n-id="pdfjs-scroll-horizontal-button-label"
                          ></span>
                        </button>
                        <button
                          id="scrollWrapped"
                          class="toolbarButton labeled"
                          type="button"
                          tabindex="0"
                          data-l10n-id="pdfjs-scroll-wrapped-button"
                          role="radio"
                          aria-checked="false"
                        >
                          <span
                            data-l10n-id="pdfjs-scroll-wrapped-button-label"
                          ></span>
                        </button>
                      </div>

                      <div class="horizontalToolbarSeparator"></div>

                      <div id="spreadModeButtons" role="radiogroup">
                        <button
                          id="spreadNone"
                          class="toolbarButton labeled toggled"
                          type="button"
                          tabindex="0"
                          data-l10n-id="pdfjs-spread-none-button"
                          role="radio"
                          aria-checked="true"
                        >
                          <span
                            data-l10n-id="pdfjs-spread-none-button-label"
                          ></span>
                        </button>
                        <button
                          id="spreadOdd"
                          class="toolbarButton labeled"
                          type="button"
                          tabindex="0"
                          data-l10n-id="pdfjs-spread-odd-button"
                          role="radio"
                          aria-checked="false"
                        >
                          <span
                            data-l10n-id="pdfjs-spread-odd-button-label"
                          ></span>
                        </button>
                        <button
                          id="spreadEven"
                          class="toolbarButton labeled"
                          type="button"
                          tabindex="0"
                          data-l10n-id="pdfjs-spread-even-button"
                          role="radio"
                          aria-checked="false"
                        >
                          <span
                            data-l10n-id="pdfjs-spread-even-button-label"
                          ></span>
                        </button>
                      </div>
                    </div>
                  </div>
                  <!-- secondaryToolbar -->
                </div>
              </div>
            </div>
            <div id="loadingBar">
              <div class="progress">
                <div class="glimmer"></div>
              </div>
            </div>
          </div>
        </div>

        <div id="viewerContainer" tabindex="0">
          <div id="viewer" class="pdfViewer"></div>
        </div>
      </div>
      <!-- mainContainer -->

      <div id="dialogContainer">
        <dialog id="passwordDialog">
          <div class="row">
            <label
              for="password"
              id="passwordText"
              data-l10n-id="pdfjs-password-label"
            ></label>
          </div>
          <div class="row">
            <input type="password" id="password" class="toolbarField" />
          </div>
          <div class="buttonRow">
            <button id="passwordCancel" class="dialogButton" type="button">
              <span data-l10n-id="pdfjs-password-cancel-button"></span>
            </button>
            <button id="passwordSubmit" class="dialogButton" type="button">
              <span data-l10n-id="pdfjs-password-ok-button"></span>
            </button>
          </div>
        </dialog>

        <!--#if !MOZCENTRAL-->
        <dialog id="printServiceDialog" style="min-width: 200px">
          <div class="row">
            <span data-l10n-id="pdfjs-print-progress-message"></span>
          </div>
          <div class="row">
            <progress value="0" max="100"></progress>
            <span
              data-l10n-id="pdfjs-print-progress-percent"
              data-l10n-args='{ "progress": 0 }'
              class="relative-progress"
              >0%</span
            >
          </div>
          <div class="buttonRow">
            <button id="printCancel" class="dialogButton" type="button">
              <span data-l10n-id="pdfjs-print-progress-close-button"></span>
            </button>
          </div>
        </dialog>
        <!--#endif-->
        <!--#if CHROME-->
        <!--#include viewer-snippet-chrome-overlays.html-->
        <!--#endif-->
      </div>
      <!-- dialogContainer -->

      <div
        id="editorUndoBar"
        class="messageBar"
        role="status"
        aria-labelledby="editorUndoBarMessage"
        tabindex="-1"
        hidden
      >
        <div>
          <div>
            <span id="editorUndoBarMessage" class="description"></span>
          </div>
          <button
            id="editorUndoBarUndoButton"
            class="undoButton"
            type="button"
            tabindex="0"
            data-l10n-id="pdfjs-editor-undo-bar-undo-button"
          >
            <span data-l10n-id="pdfjs-editor-undo-bar-undo-button-label"></span>
          </button>
          <button
            id="editorUndoBarCloseButton"
            class="closeButton"
            type="button"
            tabindex="0"
            data-l10n-id="pdfjs-editor-undo-bar-close-button"
          >
            <span
              data-l10n-id="pdfjs-editor-undo-bar-close-button-label"
            ></span>
          </button>
        </div>
      </div>
      <!-- editorUndoBar -->
    </div>
    <!-- outerContainer -->
    <div id="printContainer"></div>
  </body>
</html>
